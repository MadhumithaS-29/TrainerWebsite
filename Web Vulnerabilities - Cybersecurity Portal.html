<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Vulnerabilities - Cybersecurity Portal</title>
<style>
:root{--bg:#070d1a;--panel:#0d1730;--p2:#12203f;--line:#1f3158;--cy:#22d3ee;--tx:#e8eef9;--mu:#8ea2c4;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 Inter,Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#side{position:fixed;inset:0 auto 0 0;width:270px;background:var(--panel);border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;z-index:20;transition:transform .2s}
.brand b{display:block;font-size:17px;letter-spacing:.04em}.brand span{color:var(--mu);font-size:13px}
#q{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
#res{display:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto}
#res button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line)}#res button:hover{background:var(--p2)}#res small{color:var(--mu);display:block}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:8px;background:none;border:0;border-left:3px solid transparent;padding:9px 10px;border-radius:0 8px 8px 0;text-align:left;color:var(--mu);transition:background .15s,color .15s}
nav button:hover{background:var(--p2);color:var(--tx)}nav button.on{background:var(--p2);color:var(--tx);border-left-color:var(--cy)}
nav .ck{margin-left:auto;color:var(--ok);font-size:13px;opacity:0}nav button.done .ck{opacity:1}
.prog{margin-top:auto;font-size:13px;color:var(--mu)}.bar{height:6px;background:var(--bg);border-radius:6px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--cy);transition:width .3s}
#top{display:none;position:fixed;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--panel);border-bottom:1px solid var(--line);z-index:15;align-items:center;gap:12px}
#top button{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
main{margin-left:270px;padding:36px clamp(16px,4vw,56px) 80px;max-width:1060px}
section{display:none}section.on{display:block}
h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 10px;letter-spacing:-.02em}h2{font-size:21px;margin:34px 0 12px}h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 10px;max-width:70ch}.lead{color:var(--mu);font-size:17px;max-width:62ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.card p,.card li{color:var(--mu);font-size:14.5px}.card p{margin:0 0 8px}
.hero{background:linear-gradient(135deg,var(--p2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:clamp(20px,4vw,40px)}
.cta{background:var(--cy);color:#04202a;border:0;border-radius:10px;padding:11px 20px;font-weight:700;margin-top:10px}.cta:hover{filter:brightness(1.1)}
.mod{text-align:left;transition:border-color .15s}.mod:hover{border-color:var(--cy)}
.tag{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid;margin-left:6px;white-space:nowrap;vertical-align:middle}
.hi{border-color:var(--bad);color:var(--bad)}.md{border-color:var(--warn);color:var(--warn)}.ct{border-color:var(--cy);color:var(--cy)}
.glance{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:16px 0}
.glance div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--mu)}.glance b{display:block;color:var(--tx);font-size:15px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:6px 0 12px}
.flow div{flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--cy);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--mu)}.flow b{color:var(--tx);display:block;font-size:13px}
.flow div.x{border-top-color:var(--bad)}
.code{position:relative;background:#050a14;border:1px solid var(--line);border-radius:8px;padding:10px 70px 10px 12px;font:13.5px/1.55 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-x:auto;white-space:pre}
.code.bad{border-left:3px solid var(--bad);color:#fecaca}.code.good{border-left:3px solid var(--ok);color:#a7f3d0}
.cp{position:absolute;right:6px;top:6px;background:var(--p2);border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:12px;color:var(--tx)}.cp:hover{border-color:var(--cy)}
.tabs{display:flex;gap:6px;margin:10px 0 8px}.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:14px;color:var(--mu)}.tabs button.on{border-color:var(--cy);color:var(--tx);background:var(--p2)}
ul{margin:0 0 8px;padding-left:20px;color:var(--mu);font-size:15px}li{margin-bottom:4px}
.chk li{list-style:none;margin-left:-20px;padding-left:26px;position:relative}.chk li::before{content:"✓";position:absolute;left:4px;color:var(--ok)}
.risk li::before{content:"!";color:var(--bad);font-weight:700}
.note{border-left:3px solid var(--warn);background:var(--panel);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14.5px;color:var(--mu);margin:12px 0}
.key{border-left-color:var(--cy)}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
summary{padding:12px 16px;cursor:pointer;font-weight:600;list-style:none;display:flex;gap:10px}summary::-webkit-details-marker{display:none}summary::after{content:"+";margin-left:auto;color:var(--cy)}details[open] summary::after{content:"–"}
details>div{padding:0 16px 12px;color:var(--mu);font-size:15px}
.wrapx{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14.5px;min-width:620px}th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;color:var(--mu)}th{color:var(--tx)}td:first-child{color:var(--cy);font-weight:600;white-space:nowrap}
.learn{margin-top:30px;padding-top:18px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap}
.learn button{background:none;border:1px solid var(--ok);color:var(--ok);border-radius:10px;padding:9px 18px;font-weight:600}.learn button.on{background:var(--ok);color:#04201a}.learn .nx{border-color:var(--line);color:var(--mu)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
@media (max-width:860px){#side{transform:translateX(-100%)}#side.open{transform:none}#top{display:flex}main{margin-left:0;padding-top:76px}}
</style>
</head>
<body>
<div id="top"><button id="menu" aria-label="Open menu">Menu</button><b>Web Vulnerabilities</b></div>
<aside id="side">
 <div class="brand"><b>CYBERSECURITY PORTAL</b><span>Web Vulnerabilities Module</span></div>
 <input id="q" type="search" placeholder="Search, e.g. IDOR, encoding" aria-label="Search">
 <div id="res"></div><nav id="nav"></nav>
 <div class="prog"><span id="pt"></span><div class="bar"><i id="pb"></i></div></div>
</aside>
<main id="main"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const V=[
{id:"sqli",n:"SQL Injection",cat:"Injection",lv:"High",fix:"Parameterized queries",one:"Input changes the meaning of a database query.",
analogy:"Like writing on a form 'pay the bearer' and the clerk treating your note as an instruction instead of a name.",
what:"SQL Injection happens when an application mixes user input into a database query as text. The database cannot tell the developer's instructions from the user's data, so input can change what the query does.",
how:[["Input","User sends a value, such as a name or search term."],["Unsafe build","App joins the value into the query text."],["Database","Query runs with the changed meaning.",1],["Result","Wrong data returned, or data changed."]],
why:["Reading data the user should never see","Bypassing login checks","Changing or deleting records","In serious cases, reaching the server itself"],
test:["List every place input reaches a database: search, login, filters, sorting.","Notice if unexpected characters cause errors or change the results.","Compare normal responses with responses to unusual input.","Error messages that mention a database are a strong hint."],
prev:["Use parameterized queries (prepared statements) everywhere","Use an ORM correctly, and avoid building raw query strings","Give the database account only the permissions it needs","Hide detailed database errors from users","Validate type and length of input as an extra layer"],
bad:"query = \"SELECT * FROM users WHERE name = '\" + input + \"'\"\nrun(query)",good:"query = \"SELECT * FROM users WHERE name = ?\"\nrun(query, [input])   // input is always data",
mist:["Thinking filtering a few characters is enough","Escaping by hand instead of using parameters","Showing raw database errors on the page"],
chk:[["What is the root cause of SQL Injection?","Input is joined into the query text, so it can be read as part of the query."],["What is the main fix?","Parameterized queries, which keep data separate from the query."]]},
{id:"idor",n:"IDOR",cat:"Access control",lv:"High",fix:"Server-side ownership checks",one:"Changing an ID gives access to someone else's data.",
analogy:"Like a hotel that gives you a key card for room 204 but lets the card open any room if you ask for 205.",
what:"IDOR (Insecure Direct Object Reference) happens when an application uses an identifier, such as an order number or user ID, to find data but never checks that the logged-in user is allowed to see it.",
how:[["Request","Page asks for a record using an ID."],["Server","Finds the record by ID and trusts the request."],["Missing check","Never asks: does this record belong to you?",1],["Result","Another user's data is returned."]],
why:["Exposure of other users' personal data","Ability to change or delete other users' records","Easy to automate across many records","Often leads to large data leaks"],
test:["Notice where requests contain identifiers (numbers, names, file IDs).","Ask what happens if another valid identifier is used by the same logged-in user.","Test with two accounts to see if one can reach the other's data.","Remember: hard-to-guess IDs do not replace permission checks."],
prev:["Check on the server that the user owns or may access each object","Deny by default when no rule allows access","Take the user identity from the session, not from the request","Use unpredictable IDs only as an extra layer","Log repeated access to records the user doesn't own"],
bad:"record = db.get(request.id)\nreturn record          // no owner check",good:"record = db.get(request.id)\nif record.owner != session.user:\n    return 403\nreturn record",
mist:["Assuming hidden or long IDs are secret enough","Checking only that the user is logged in","Trusting a user ID sent by the browser"],
chk:[["Is a random-looking ID a fix for IDOR?","No. It makes guessing harder, but the server must still check permission."],["What should the server compare?","The owner of the object against the logged-in user."]]},
{id:"traversal",n:"Path Traversal",cat:"File handling",lv:"High",fix:"Resolve and confirm the path",one:"Input escapes the intended folder to reach other files.",
analogy:"Like asking a librarian for a book from one shelf, then saying 'go up two floors' and getting into the staff office.",
what:"Path Traversal happens when user input is used to build a file path, and the app does not check that the final path stays inside the intended folder. Special path sequences can move the path outward.",
how:[["Input","User names a file to download or view."],["Path built","App joins the name to a base folder."],["No check","Final path is never confirmed to stay inside the folder.",1],["Result","A file outside the folder is returned."]],
why:["Exposure of configuration files and secrets","Exposure of source code and logs","Information used for further attacks","In some cases, files can be overwritten"],
test:["Find features that load files by name: downloads, images, templates.","Think about how '..' and folder separators are handled.","Notice if the app shows file paths in errors.","Check whether different encodings of the same path are treated the same."],
prev:["Avoid using user input in file paths at all","Map safe IDs to files instead of using raw names","Allow only a list of known file names","Resolve the final path, then confirm it starts with the allowed folder","Run the app with limited file permissions"],
bad:"path = BASE + \"/\" + filename\nreturn read(path)",good:"path = resolve(BASE + \"/\" + filename)\nif not path.startswith(BASE):\n    return 400\nreturn read(path)",
mist:["Only removing '..' once and calling it done","Checking the name before decoding it","Running the app with access to the whole disk"],
chk:[["What must be true about the final path?","It must still be inside the allowed base folder after being fully resolved."],["Why is a file ID better than a file name?","The user can't choose a path, only an item from the app's own list."]]},
{id:"bac",n:"Broken Access Control",cat:"Access control",lv:"High",fix:"Enforce permissions on the server",one:"Users can do or see things they should not be allowed to.",
analogy:"Like a building where the door to the staff area is unmarked rather than locked.",
what:"Broken Access Control means the application does not properly enforce what each user is allowed to do. IDOR is one type. Others include reaching admin pages or actions without the right role.",
how:[["Login","User proves who they are (authentication)."],["Request","User asks for a page or action."],["Weak rule","Server doesn't check permission, or only hides the button.",1],["Result","User reaches features meant for others."]],
why:["Regular users gain admin abilities","Data of other users or the company is exposed","Records can be changed or deleted without permission","Often the most common serious web issue"],
test:["Compare what each role (guest, user, admin) can see and do.","Ask whether hiding a button is the only thing blocking an action.","Check whether actions work when the page link is opened directly.","Check that every request, not just pages, is protected."],
prev:["Enforce permissions on the server for every request","Deny by default, then allow specific roles","Use one shared permission system, not scattered checks","Never rely on hidden links or client-side checks","Log and review denied access attempts"],
bad:"// Admin page\nreturn render(\"admin\")   // only the menu link is hidden",good:"if session.role != \"admin\":\n    return 403\nreturn render(\"admin\")",
mist:["Hiding links instead of blocking access","Checking permissions on some endpoints only","Trusting a role value sent from the browser"],
chk:[["Authentication vs authorization?","Authentication proves who you are. Authorization decides what you may do."],["Is hiding a menu item access control?","No. The server must still refuse the request."]]},
{id:"xss",n:"Reflected XSS",cat:"Injection",lv:"Medium",fix:"Output encoding",one:"Input shown back on a page runs as script in the browser.",
analogy:"Like a mirror that doesn't just show your words but also carries out instructions you wrote on a note.",
what:"Reflected Cross-Site Scripting happens when the server puts input from a request into the response page without encoding it. The browser then treats that input as part of the page's code instead of plain text.",
how:[["Request","A link or form sends input to the app."],["Reflect","Server includes the input in the response page."],["No encoding","Browser reads the input as code.",1],["Result","Script runs as the victim, on the trusted site."]],
why:["Theft of session data or tokens","Actions performed as the victim","Fake content or login forms on a trusted page","Spread by sending a crafted link"],
test:["Find where text you send comes back on the page: search, errors, messages.","Notice whether special characters appear literally or change the page.","Check each place it appears: body text, attribute, or script area.","Remember the victim must open the crafted link."],
prev:["Encode output for where it is used (HTML, attribute, JavaScript, URL)","Use a framework that encodes output by default","Validate and limit input as an extra layer","Add a Content Security Policy","Set HttpOnly on session cookies"],
bad:"html = \"<p>Results for \" + input + \"</p>\"",good:"html = \"<p>Results for \" + htmlEncode(input) + \"</p>\"",
mist:["Encoding for HTML when the value is placed inside JavaScript","Relying only on input filters","Turning off a framework's automatic encoding"],
chk:[["Why is it called reflected?","The input is sent back in the immediate response, not stored."],["Best primary defense?","Context-aware output encoding."]]},
{id:"cmdi",n:"Command Injection",cat:"Injection",lv:"High",fix:"Avoid shell commands",one:"Input changes which system command runs on the server.",
analogy:"Like telling an assistant 'order lunch', and they also carry out the extra task you slipped into the same sentence.",
what:"Command Injection happens when an application passes user input to an operating system command. If the command is built as text, extra characters can add or change commands the server runs.",
how:[["Input","User supplies a value, such as a host name."],["Command built","App puts it inside a shell command string."],["Shell","Shell reads extra command characters in the input.",1],["Result","Server runs commands the developer never intended."]],
why:["Running commands on the server","Reading or changing server files","Using the server to attack other systems","Possible full compromise of the host"],
test:["Look for features that seem to call system tools: ping, conversion, backups.","Think about which characters a shell treats as special.","Notice if output looks like raw tool output.","Observe differences in response time or output when input changes."],
prev:["Avoid system commands when a library can do the job","Pass arguments as a list, not one shell string","Allow-list valid input, such as IP addresses only","Run the app as a low-privilege user","Keep the server able to reach only what it needs"],
bad:"run_shell(\"ping -c 1 \" + input)",good:"if not is_valid_ip(input): return 400\nrun([\"ping\", \"-c\", \"1\", input])  // no shell",
mist:["Blocking a short list of bad characters","Validating in the browser only","Running the web app as an administrator"],
chk:[["Why is a shell string risky?","The shell interprets special characters in the input as commands."],["Safer alternative?","Use a library, or run a fixed command with separate arguments and validated input."]]}];
const ORDER=["overview",...V.map(v=>v.id),"compare"];
const DONE=new Set();try{JSON.parse(localStorage.getItem("wv-done")||"[]").forEach(x=>DONE.add(x))}catch(e){}
const code=(t,c)=>`<div class="code ${c||""}" data-c="${esc(t)}">${esc(t)}<button class="cp">Copy</button></div>`;
const list=(a,c)=>`<ul class="${c||""}">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
const learnBar=id=>{const i=ORDER.indexOf(id),nx=ORDER[i+1];return `<div class="learn"><button data-learn="${id}" class="${DONE.has(id)?"on":""}">${DONE.has(id)?"Learned ✓":"Mark as learned"}</button>${nx?`<button class="nx" data-go="${nx}">Next topic →</button>`:""}</div>`};
const title=id=>id=="overview"?"Overview":id=="compare"?"Compare and Review":V.find(v=>v.id==id).n;
const IDX=[];
function vuln(v){
 IDX.push({s:v.id,t:v.n,x:(v.n+" "+v.what+" "+v.cat).toLowerCase()});v.chk.forEach(c=>IDX.push({s:v.id,t:v.n+": "+c[0],x:(c[0]+c[1]).toLowerCase()}));
 return `<h1>${v.n}<span class="tag ${v.lv=="High"?"hi":"md"}">${v.lv} impact</span><span class="tag ct">${v.cat}</span></h1><p class="lead">${v.one}</p>
 <div class="glance"><div>Category<b>${v.cat}</b></div><div>Impact<b>${v.lv}</b></div><div>Main defense<b>${v.fix}</b></div></div>
 <div class="note key"><b>Think of it this way.</b> ${v.analogy}</div>
 <h2>What is it?</h2><p>${v.what}</p>
 <h2>How does it happen?</h2><div class="flow">${v.how.map(s=>`<div class="${s[2]?"x":""}"><b>${s[0]}</b>${s[1]}</div>`).join("")}</div>
 <p>The mistake is in the red step: the app trusts input that it should treat as untrusted.</p>
 <div class="tabs"><button data-t="bad" class="on">Unsafe pattern</button><button data-t="good">Safer pattern</button></div>
 <div data-tp="bad">${code(v.bad,"bad")}</div><div data-tp="good" style="display:none">${code(v.good,"good")}</div>
 <h2>Why is it dangerous?</h2><div class="card">${list(v.why,"chk risk")}</div>
 <h2>What should a tester understand?</h2><div class="card">${list(v.test)}<p style="margin-top:8px">The goal is to understand where trust is missing, not to memorise tricks.</p></div>
 <h2>How to prevent it</h2><div class="card">${list(v.prev,"chk")}</div>
 <h2>Common mistakes</h2><div class="note">${list(v.mist)}</div>
 <h2>Check yourself</h2>${v.chk.map(c=>`<details><summary>${c[0]}</summary><div>${c[1]}</div></details>`).join("")}${learnBar(v.id)}`}
const P={overview:()=>{IDX.push({s:"overview",t:"Core ideas",x:"untrusted input server-side authorization least privilege"});
 return `<div class="hero"><h1>Web Vulnerabilities</h1><p class="lead">Six common web application weaknesses. For each one you will learn what it is, how it happens, why it matters, what a tester looks for, and how developers prevent it.</p><button class="cta" data-go="sqli">Start with SQL Injection →</button></div>
 <h2>Three ideas behind all six</h2><div class="grid"><div class="card"><h3>Never trust input</h3><p>Anything from the user is untrusted: forms, URLs, headers, cookies, file names.</p></div><div class="card"><h3>Check on the server</h3><p>The browser can be changed by the user. Security checks must run on the server.</p></div><div class="card"><h3>Give the least access</h3><p>Users, database accounts, and the app itself should have only the permissions they need.</p></div></div>
 <h2>Modules</h2><div class="grid">${V.map(v=>`<button class="card mod" data-go="${v.id}"><h3>${v.n}<span class="tag ${v.lv=="High"?"hi":"md"}">${v.lv}</span></h3><p>${v.one}</p></button>`).join("")}</div>
 <div class="note" style="margin-top:20px">This module teaches concepts for authorized training. Only test systems you own or have written permission to test.</div>`+learnBar("overview")},
 compare:()=>{IDX.push({s:"compare",t:"Comparison table",x:"compare summary defenses impact"});
 return `<h1>Compare and Review</h1><p class="lead">A one-page summary to use during the workshop.</p><div class="wrapx card"><table><tr><th>Vulnerability</th><th>Root cause</th><th>Main defense</th><th>Impact</th></tr>${V.map(v=>`<tr><td>${v.n}</td><td>${v.one}</td><td>${v.fix}</td><td>${v.lv}</td></tr>`).join("")}</table></div>
 <h2>Which control stops which problem?</h2><div class="grid"><div class="card"><h3>Separate data from code</h3><p>Parameterized queries stop SQL Injection. Argument lists stop Command Injection. Output encoding stops XSS.</p></div><div class="card"><h3>Check who is asking</h3><p>Ownership and role checks on the server stop IDOR and Broken Access Control.</p></div><div class="card"><h3>Confine the resource</h3><p>Resolving and checking the path stops Path Traversal.</p></div></div>`+learnBar("compare")}};
V.forEach(v=>P[v.id]=()=>vuln(v));
function render(){$("#main").innerHTML=ORDER.map(i=>`<section id="s-${i}">${P[i]()}</section>`).join("");
 $("#nav").innerHTML=ORDER.map(i=>`<button data-go="${i}" id="n-${i}">${title(i)}<span class="ck">✓</span></button>`).join("")}
function prog(){const n=ORDER.filter(i=>DONE.has(i)).length;$("#pt").textContent=n+" of "+ORDER.length+" learned";$("#pb").style.width=n/ORDER.length*100+"%";ORDER.forEach(i=>$("#n-"+i).classList.toggle("done",DONE.has(i)))}
function go(id){if(!document.getElementById("s-"+id))id="overview";document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id=="s-"+id));ORDER.forEach(i=>$("#n-"+i).classList.toggle("on",i==id));$("#side").classList.remove("open");window.scrollTo(0,0);try{history.replaceState(null,"","#"+id)}catch(e){}}
render();prog();
document.addEventListener("click",e=>{const t=e.target;let b;
 if(b=t.closest("[data-go]"))return go(b.dataset.go);
 if(b=t.closest("[data-learn]")){const k=b.dataset.learn;DONE.has(k)?DONE.delete(k):DONE.add(k);try{localStorage.setItem("wv-done",JSON.stringify([...DONE]))}catch(x){}b.classList.toggle("on",DONE.has(k));b.textContent=DONE.has(k)?"Learned ✓":"Mark as learned";return prog()}
 if(b=t.closest(".cp")){const txt=b.parentElement.dataset.c;const ok=()=>{b.textContent="Copied";setTimeout(()=>b.textContent="Copy",1200)};const fb=()=>{const a=document.createElement("textarea");a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(x){}a.remove()};try{navigator.clipboard.writeText(txt).then(ok,fb)}catch(x){fb()}return}
 if(b=t.closest("[data-t]")){const sec=b.closest("section");sec.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("on",x==b));sec.querySelectorAll("[data-tp]").forEach(p=>p.style.display=p.dataset.tp==b.dataset.t?"":"none");return}
 if(b=t.closest("[data-r]")){go(b.dataset.r);$("#q").value="";$("#res").style.display="none"}});
$("#menu").onclick=()=>$("#side").classList.toggle("open");
$("#q").addEventListener("input",e=>{const v=e.target.value.trim().toLowerCase(),r=$("#res");if(!v){r.style.display="none";return}
 const m=IDX.filter(x=>x.x.includes(v)).slice(0,8);
 r.innerHTML=m.length?m.map(x=>`<button data-r="${x.s}">${esc(x.t)}<small>${title(x.s)}</small></button>`).join(""):"<button disabled>No match. Try a shorter term.</button>";r.style.display="block"});
go((location.hash||"#overview").slice(1));
